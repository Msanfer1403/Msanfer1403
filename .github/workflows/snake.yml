
name: Generate Neon Contribution Snake

on:
  schedule:
    - cron: "17 0 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Generate neon green snake
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Msanfer1403
          outputs: |
            dist/github-snake.svg?color_snake=%2300FF41&color_dots=%230d1117,%230d2818,%23006426,%2300a83b,%2300ff41
            dist/github-snake-dark.svg?palette=github-dark&color_snake=%2300FF41&color_dots=%230d1117,%230d2818,%23006426,%2300a83b,%2300ff41

      - name: Publish snake SVG files
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
